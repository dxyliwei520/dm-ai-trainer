---
job: extension
config:
  name: "h3_koi_smoke"
  process:
    - type: 'sd_trainer'
      training_folder: "E:/ai-train/runs/h3_koi_smoke"
      device: cuda:0
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 5
        max_step_saves_to_keep: 2
        push_to_hub: false
      datasets:
        - folder_path: "E:/ai-train/datasets/h3_koi_neon/videos"
          caption_ext: "txt"
          caption_dropout_rate: 0.0
          shuffle_tokens: false
          cache_latents_to_disk: false
          resolution: [ 768, 448 ]
      train:
        batch_size: 1
        steps: 5
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1.0e-4
        dtype: bf16
        unload_text_encoder: true
        disable_sampling: true
        skip_first_sample: true
      model:
        arch: "minimax_h3"
        name_or_path: "MiniMaxAI/MiniMax-H3"
        quantize: true
        quantize_te: true
        low_vram: true
        model_kwargs:
          partition: "fl2va_pruned"
      sample:
        sampler: "flowmatch"
        sample_every: 1000
        width: 768
        height: 448
        num_frames: 56
        fps: 24
        prompts:
          - "a glowing neon koi fish swimming through a rainy Japanese alley at night"
        neg: ""
        seed: 42
        sample_steps: 8
meta:
  name: "[name]"
  version: '1.0'